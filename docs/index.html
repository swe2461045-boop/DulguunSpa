<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mongolian Food Composition Database" />
    <meta name="keywords" content="nutrition, food composition, mongolian traditional foods" />
    <link rel="stylesheet" href="./css/main.css" />
    <script defer src="./js/fontawesomeall.min.js"></script>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) {}
        })();
    </script>
    <title>Mongolian Food Composition Database</title>
</head>

<body>
    <div id="navbar"></div>

    <main>
        <div id="app"></div>
    </main>

    <div id="footer"></div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
